<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>光伏电站技术支持 Agent</title>
<style>
  :root {
    --bg: #eef2f7;
    --panel: #ffffff;
    --line: #dbe3ec;
    --text: #1c2733;
    --muted: #6b7a8d;
    --brand: #0f766e;
    --brand-soft: #e6f4f1;
    --accent: #d97706;
    --danger: #b42318;
    --radius: 12px;
    --shadow: 0 1px 2px rgba(16, 32, 48, .06), 0 8px 24px rgba(16, 32, 48, .06);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 15px/1.65 -apple-system, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    color: var(--text);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  .app { display: flex; height: 100vh; overflow: hidden; }

  /* ---------- 侧栏 ---------- */
  .sidebar {
    width: 268px; flex: 0 0 268px;
    background: var(--panel);
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column;
  }
  .brand {
    padding: 18px 18px 14px;
    border-bottom: 1px solid var(--line);
  }
  .brand h1 { margin: 0; font-size: 15px; letter-spacing: .2px; }
  .brand p { margin: 4px 0 0; font-size: 12px; color: var(--muted); }
  .side-body { flex: 1; overflow-y: auto; padding: 14px; }
  .side-label {
    font-size: 12px; color: var(--muted); font-weight: 600;
    margin: 6px 2px 8px; display: flex; justify-content: space-between; align-items: center;
  }
  .session {
    padding: 9px 11px; border-radius: 9px; cursor: pointer;
    font-size: 13px; color: #3c4a5a; border: 1px solid transparent;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .session:hover { background: #f4f7fa; }
  .session.active { background: var(--brand-soft); border-color: #bfe0da; color: #0b5a54; font-weight: 600; }
  .session small { display: block; color: var(--muted); font-weight: 400; font-size: 11px; }
  .side-foot { padding: 12px 14px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }

  /* ---------- 主区 ---------- */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .topbar {
    height: 58px; flex: 0 0 58px;
    background: var(--panel); border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 10px; padding: 0 20px;
  }
  .topbar .title { font-weight: 600; font-size: 14px; }
  .badge {
    font-size: 12px; padding: 3px 9px; border-radius: 999px;
    background: #eef2f7; color: var(--muted); border: 1px solid var(--line);
  }
  .badge.on { background: #e8f6ee; color: #10693c; border-color: #bce3cd; }
  .badge.off { background: #fdf3e3; color: #8a5a08; border-color: #f0d9ad; }
  .spacer { flex: 1; }

  .messages { flex: 1; overflow-y: auto; padding: 26px 20px 8px; }
  .wrap { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

  .msg { display: flex; gap: 11px; }
  .avatar {
    width: 30px; height: 30px; flex: 0 0 30px; border-radius: 8px;
    display: grid; place-items: center; font-size: 13px; font-weight: 700;
  }
  .msg.user .avatar { background: #e2e8f0; color: #475569; }
  .msg.bot .avatar { background: var(--brand); color: #fff; }
  .bubble {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 11px 14px; box-shadow: var(--shadow); max-width: 100%;
    overflow-wrap: anywhere;
  }
  .msg.user .bubble { background: #f8fafc; }
  .bubble p { margin: 0 0 8px; }
  .bubble p:last-child { margin-bottom: 0; }

  .cites { margin-top: 12px; border-top: 1px dashed var(--line); padding-top: 9px; }
  .cites .h { font-size: 12px; color: var(--brand); font-weight: 600; cursor: pointer; margin-bottom: 0; }
  .cites .h::after { content: '展开'; float: right; color: var(--muted); font-weight: 400; }
  .cites[open] .h { margin-bottom: 8px; }
  .cites[open] .h::after { content: '收起'; }
  .cite {
    font-size: 12.5px; border: 1px solid var(--line); border-radius: 9px;
    padding: 7px 10px; margin-bottom: 6px; background: #fbfcfe;
  }
  .cite .t { display: flex; gap: 8px; align-items: baseline; }
  .cite .n { color: var(--brand); font-weight: 700; }
  .cite .f { font-weight: 600; }
  .cite .s { margin-left: auto; color: var(--muted); font-size: 11.5px; white-space: nowrap; }
  .cite .m { font-size: 11px; color: #6b7d90; margin-top: 3px; }
  .cite .e { color: #4b5b6d; margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2;
             -webkit-box-orient: vertical; overflow: hidden; }
  .cite.open .e { -webkit-line-clamp: unset; }
  .cite { cursor: pointer; }

  .pending {
    margin-top: 10px; border: 1px solid #f0d9ad; background: #fffaf1;
    border-radius: 10px; padding: 11px 12px;
  }
  .pending .s { font-size: 13px; color: #8a5a08; }
  .pending .row { margin-top: 9px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .pending .ok { font-size: 13px; color: #10693c; font-weight: 600; }

  /* 版本并列提示：依据来自多份资料时并列列出，由用户按现场版本取舍 */
  .conflict {
    margin-top: 10px; border: 1px solid #ccd9e6; background: #f7fafd;
    border-radius: 10px; padding: 11px 12px;
  }
  .conflict .h { font-size: 12.5px; font-weight: 600; color: #33506b; }
  .conflict .tip { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.6; }
  .conflict .v { margin-top: 9px; border-top: 1px dashed #dbe4ee; padding-top: 8px; }
  .conflict .v .t { display: flex; gap: 8px; align-items: baseline; }
  .conflict .v .n { font-size: 12.5px; font-weight: 700; color: #24425e; }
  .conflict .v .s { margin-left: auto; color: var(--muted); font-size: 11.5px; }
  .conflict .v .f { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
  .conflict .v .e { font-size: 12px; color: #4b5b6d; margin-top: 4px; }

  /* 状态标签：终态由服务端给出，前端不再靠话术文本去猜 */
  .state { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 9px; }
  .state .tag {
    font-size: 11.5px; line-height: 1.5; padding: 1px 8px; border-radius: 999px;
    border: 1px solid var(--line); background: #fff; color: var(--muted);
  }
  .state .tag.warn { color: #8a5a08; background: #fdf3e3; border-color: #f0d9ad; }
  .state .tag.bad { color: #a12c2c; background: #fdecec; border-color: #f0c9c9; }

  .feedback { margin-top: 7px; display: flex; gap: 6px; align-items: center; }
  .fb {
    border: 1px solid var(--line); background: #fff; border-radius: 7px;
    font-size: 12px; padding: 2px 8px; cursor: pointer; color: var(--muted);
  }
  .fb:hover { border-color: #b9c6d4; color: var(--text); }
  .fb.done { background: var(--brand-soft); border-color: #bfe0da; color: #0b5a54; }

  .composer { padding: 12px 20px 20px; }
  .composer-inner {
    max-width: 780px; margin: 0 auto; background: var(--panel);
    border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
    padding: 10px 10px 8px 14px;
  }
  .composer textarea {
    width: 100%; border: 0; outline: 0; resize: none; font: inherit;
    min-height: 44px; max-height: 168px; padding: 4px 0; background: transparent;
  }
  .composer-foot { display: flex; align-items: center; gap: 8px; }
  .hint { font-size: 12px; color: var(--muted); }
  button.primary {
    margin-left: auto; border: 0; background: var(--brand); color: #fff;
    border-radius: 9px; padding: 8px 18px; font: inherit; font-weight: 600; cursor: pointer;
  }
  button.primary:disabled { background: #9db8b4; cursor: not-allowed; }
  button.ghost {
    border: 1px solid var(--line); background: #fff; color: #44566b;
    border-radius: 9px; padding: 7px 13px; font: inherit; font-size: 13px; cursor: pointer;
  }
  button.ghost:hover { border-color: #b9c6d4; }
  .chips { max-width: 780px; margin: 0 auto 10px; display: flex; gap: 7px; flex-wrap: wrap; }
  .chip {
    border: 1px solid var(--line); background: #fff; border-radius: 999px;
    padding: 5px 12px; font-size: 12.5px; color: #44566b; cursor: pointer;
  }
  .chip:hover { border-color: var(--brand); color: var(--brand); background: var(--brand-soft); }
  .chip.active { border-color: var(--brand); color: var(--brand); background: var(--brand-soft); }
  .workflow-panel {
    max-width: 780px; margin: 0 auto 10px; padding: 10px 13px;
    background: #fff; border: 1px solid var(--line); border-radius: 10px;
    color: #44566b; font-size: 13px;
  }
  .workflow-panel[hidden] { display: none; }
  .workflow-panel strong { color: var(--text); }
  .workflow-panel .close { float: right; border: 0; background: transparent; color: var(--muted); cursor: pointer; }
  .pointtable-form { margin-top: 10px; }
  .pointtable-form label { display: block; font-size: 13px; color: #44566b; }
  .pointtable-form input, .pointtable-form select { display: block; width: 100%; margin-top: 4px;
    padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; font: inherit; background: #fff; }
  .pointtable-fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;
    margin: 12px 0; }
  .pointtable-form .primary { margin: 12px 0 0; }
  .pointtable-note { margin-top: 8px; font-size: 12px; color: var(--muted); }
  .pointtable-scroll { overflow-x: auto; max-height: 340px; overflow-y: auto; margin-top: 12px;
    border: 1px solid var(--line); border-radius: 8px; }
  .pointtable-scroll table { border-collapse: collapse; min-width: 920px; width: 100%; font-size: 12px; }
  .pointtable-scroll th, .pointtable-scroll td { border-bottom: 1px solid var(--line);
    padding: 5px; text-align: left; vertical-align: top; }
  .pointtable-scroll th { position: sticky; top: 0; background: #f7fafc; z-index: 1; }
  .pointtable-scroll input, .pointtable-scroll select { min-width: 90px; padding: 5px; margin: 0; }
  .pointtable-scroll td:first-child input { min-width: 160px; }
  .pointtable-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .quiz-answer { font-size: 20px; font-weight: 700; color: var(--brand); margin: 2px 0 8px; }
  .quiz-stem { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
  .quiz-edit { margin-top: 12px; border-top: 1px dashed var(--line); padding-top: 8px; }
  .quiz-edit summary { color: var(--brand); cursor: pointer; font-size: 12px; }
  .quiz-edit textarea { width: 100%; min-height: 120px; margin: 8px 0; padding: 8px;
    border: 1px solid var(--line); border-radius: 8px; resize: vertical; font: inherit; }
  .quiz-thumb { max-width: 320px; max-height: 180px; display: block; border-radius: 8px; }

  .empty { text-align: center; color: var(--muted); padding: 56px 20px; }
  .empty h2 { font-size: 17px; color: var(--text); margin: 0 0 6px; }
  .empty p { margin: 0 0 4px; font-size: 13.5px; }
  .typing span {
    display: inline-block; width: 6px; height: 6px; margin-right: 3px; border-radius: 50%;
    background: #a9b8c7; animation: b 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: .18s; }
  .typing span:nth-child(3) { animation-delay: .36s; }
  @keyframes b { 0%, 60%, 100% { opacity: .3; } 30% { opacity: 1; } }
  .err { color: var(--danger); font-size: 13px; }
  [hidden] { display: none !important; }
  .login-screen { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
  .login-card { width: min(100%, 390px); background: var(--panel); padding: 28px;
    border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); }
  .login-card h1 { font-size: 20px; margin: 0 0 6px; }
  .login-card p { color: var(--muted); font-size: 13px; margin: 0 0 20px; }
  .login-card label { display: block; font-size: 13px; margin: 12px 0 5px; }
  .login-card input { width: 100%; padding: 10px 12px; border: 1px solid var(--line);
    border-radius: 9px; font: inherit; }
  .login-card > .primary { width: 100%; margin: 20px 0 0; }
  .user-card { width: min(100%, 640px); max-height: 90vh; overflow: auto; }
  .user-create { display: flex; gap: 8px; align-items: end; }
  .user-create label { flex: 1 1 auto; min-width: 0; margin: 0; }
  .user-create input { width: 100%; }
  .user-create button.primary { flex: 0 0 auto; white-space: nowrap; margin: 0; width: auto; }
  .user-row { display: flex; gap: 8px; align-items: center; padding: 10px 0;
    border-top: 1px solid var(--line); font-size: 13px; }
  .user-row .name { flex: 1; font-weight: 600; }
  .user-row .hint { font-size: 12px; }
  .user-row button { font-size: 12px; padding: 5px 8px; }
  .credential { background: #fff9eb; border: 1px solid #f0d9ad; border-radius: 9px;
    padding: 10px 12px; margin: 12px 0; overflow-wrap: anywhere; }

  .ops-card { width: min(980px, 95vw); max-height: 88vh; overflow-y: auto; }
  .ops-nav { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0; }
  .ops-row { padding: 12px 0; border-top: 1px solid var(--line); }
  .ops-row strong { display: block; overflow-wrap: anywhere; }
  .ops-row .pointtable-fields { margin-top: 8px; }
  .ops-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px,1fr)); gap: 10px; }
  .ops-stat { border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .ops-stat strong { display: block; font-size: 24px; color: var(--brand); }
  .ops-pager { display: flex; align-items: center; gap: 12px; margin-top: 14px; }

  .history-toggle { display:none; }
  @media (max-width: 1100px) { .topbar { flex-wrap:wrap;height:auto;min-height:58px;padding:8px 12px; } }
  @media (max-width: 860px) {
    .sidebar { width:220px;flex-basis:220px; }
  }
  @media (max-width: 600px) {
    .history-toggle { display:inline-block; }
    .sidebar { display:none; }
    .app.history-open .sidebar { display:flex;position:absolute;inset:0 auto 0 0;z-index:60;width:260px;box-shadow:var(--shadow); }
    .app.history-open .history-toggle { position:relative;z-index:61; }
  }
  @media (max-width: 480px) {
    .user-create { flex-direction: column; align-items: stretch; }
    .user-create button.primary { width: 100%; }
    .pointtable-fields { grid-template-columns: 1fr; }
  }
  .image-draft-cards { display:flex; gap:8px; flex-wrap:wrap; max-height:160px; overflow:auto; margin:6px 0; }
  .image-draft-card { width:96px; flex:0 0 96px; }
  .image-draft-card img { display:block; width:96px; height:68px; object-fit:contain; border:1px solid var(--line); border-radius:6px; }
  .image-draft-card button { padding:3px 8px; width:100%; font-size:12px; }
  .image-draft-cards .quiz-thumb { width:130px; max-height:150px; object-fit:contain; margin:0; }
</style>
</head>
<body>
<div class="login-screen" id="loginScreen">
  <form class="login-card" id="loginForm">
    <h1>登录技术支持助手</h1>
    <p>请使用管理员分配的账号登录。</p>
    <label for="loginName">账号</label>
    <input id="loginName" name="username" value="admin" autocomplete="username" required>
    <label for="loginPassword">密码</label>
    <input id="loginPassword" name="password" type="password" autocomplete="current-password" required>
    <div class="err" id="loginError" role="alert"></div>
    <button class="primary" type="submit">登录</button>
  </form>
</div>
<div class="login-screen" id="passwordScreen" hidden>
  <form class="login-card" id="passwordForm">
    <h1>修改管理员密码</h1>
    <p>修改后需要重新登录。</p>
    <label for="currentPassword">当前密码</label>
    <input id="currentPassword" type="password" autocomplete="current-password" required>
    <label for="newPassword">新密码（至少 8 个字符）</label>
    <input id="newPassword" type="password" autocomplete="new-password" minlength="8" required>
    <div class="err" id="passwordError" role="alert"></div>
    <button class="primary" type="submit">保存新密码</button>
    <button class="ghost" id="passwordCancel" type="button" style="width:100%;margin-top:8px">取消</button>
  </form>
</div>
<div class="login-screen" id="usersScreen" hidden>
  <div class="login-card user-card">
    <h1>管理 user 账号</h1>
    <p>创建后会显示一次初始密码，请交给对应人员，并请对方登录后修改。</p>
    <form class="user-create" id="userCreateForm">
      <label for="newUsername">登录名或工号
        <input id="newUsername" minlength="3" maxlength="32" pattern="[A-Za-z0-9][A-Za-z0-9._-]{2,31}" required>
      </label>
      <button class="primary" type="submit">创建 user</button>
    </form>
    <div class="err" id="userError" role="alert"></div>
    <div class="credential" id="userCredential" hidden></div>
    <div id="usersList"></div>
    <button class="ghost" id="usersClose" type="button" style="width:100%;margin-top:16px">关闭</button>
  </div>
</div>
<div class="login-screen" id="opsScreen" hidden>
  <div class="login-card ops-card">
    <h1>管理中心</h1>
    <div class="ops-nav">
      <button class="ghost" data-ops="overview">运行概况</button>
      <button class="ghost" data-ops="documents">资料管理</button>
      <button class="ghost" data-ops="audit">操作记录</button>
      <button class="ghost" data-ops="backups">备份</button>
    </div>
    <div class="err" id="opsError" role="alert"></div>
    <div id="opsContent"></div>
    <button class="ghost" id="opsClose" type="button" style="width:100%;margin-top:16px">关闭</button>
  </div>
</div>
<div class="app" id="appRoot" hidden>
  <aside class="sidebar">
    <div class="brand">
      <h1>光伏电站技术支持</h1>
      <p>Knowledge Base Agent</p>
    </div>
    <div class="side-body">
      <button class="ghost" id="newBtn" style="width:100%">+ 新建会话</button>
      <div class="side-label" style="margin-top:16px">历史会话</div>
      <div id="sessionList"></div>
      <div class="side-label" id="knowledgeLabel" style="margin-top:18px">知识库</div>
      <button class="ghost" id="uploadBtn" style="width:100%">导入文档（PDF/TXT/MD）</button>
      <input type="file" id="fileInput" hidden accept=".pdf,.txt,.md,.markdown,.text">
      <div id="uploadMsg" class="side-foot" style="border:0;padding:8px 2px"></div>
    </div>
    <div class="side-foot">
      <div id="health">正在检查服务…</div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="ghost history-toggle" id="historyToggle" type="button" aria-expanded="false">历史对话</button>
      <span class="title">技术支持助手</span>
      <span class="badge" id="modeBadge">…</span>
      <span class="spacer"></span>
      <span class="badge" id="userBadge">未登录</span>
      <button class="ghost" id="opsBtn" type="button" hidden>管理中心</button>
      <button class="ghost" id="usersBtn" type="button" hidden>管理用户</button>
      <button class="ghost" id="passwordBtn" type="button">修改密码</button>
      <button class="ghost" id="logoutBtn" type="button">退出</button>
    </div>

    <div class="messages" id="messages">
      <div class="wrap" id="wrap"></div>
    </div>

    <div class="composer">
      <div class="chips" id="chips"></div>
      <div class="workflow-panel" id="workflowPanel" hidden></div>
      <div class="composer-inner">
        <div id="imageDrafts" hidden aria-live="polite"></div>
        <textarea id="input" rows="1" placeholder="描述现场问题或粘贴学习题目（Enter 发送，Shift+Enter 换行）"></textarea>
        <div class="composer-foot">
          <span class="hint" id="hint">已连接本地服务</span>
          <button class="ghost" id="quizBtn" type="button">📷 上传图片</button>
          <input type="file" id="quizInput" hidden multiple accept="image/png,image/jpeg,image/webp">
          <button class="primary" id="sendBtn">发送</button>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
const state = { sessionId: null, userId: null, csrfToken: null, busy: false, pendingImages: [] };

const WORKFLOWS = {
  pointTable: {
    label: '点表制作',
    title: '点表制作',
    description: '选择南向或北向，上传设备协议，再补齐缺失信息。',
    placeholder: '也可以在这里询问点表规则或设备协议',
  },
};

const $ = (id) => document.getElementById(id);
const wrap = $('wrap');
const input = $('input');
const defaultPlaceholder = input.placeholder;

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function fmt(s) {
  return esc(s)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .split(/\n{2,}/).map((p) => '<p>' + p.replace(/\n/g, '<br>') + '</p>').join('');
}

async function api(path, options) {
  options = options || {};
  const method = (options.method || 'GET').toUpperCase();
  const headers = new Headers(options.headers || {});
  if (state.csrfToken && !['GET', 'HEAD', 'OPTIONS'].includes(method)) {
    headers.set('X-CSRF-Token', state.csrfToken);
  }
  const res = await fetch(path, { ...options, headers, credentials: 'same-origin' });
  if (!res.ok) {
    let detail = 'HTTP ' + res.status;
    try { const j = await res.json(); if (j && j.detail) detail = typeof j.detail === 'string' ? j.detail : JSON.stringify(j.detail); } catch (e) {}
    if (res.status === 401 && path !== '/auth/login' && path !== '/auth/me') showLogin();
    throw new Error(detail);
  }
  if (res.status === 204) return null;
  return res.json();
}

/* 服务端给出的终态；completed 是正常回答，不需要额外打扰用户 */
const STATUS = {
  blocked: { label: '已拦截', cls: 'bad' },
  degraded: { label: '模型不可用', cls: 'warn' },
  pending_confirmation: { label: '等待人工确认', cls: 'warn' },
  needs_clarification: { label: '需要补充信息', cls: 'warn' },
  failed: { label: '没有依据，未作答', cls: 'warn' },
};
const SOURCE = {
  knowledge: '依据：本地资料摘要',
  tool: '依据：工具查询结果',
  model: '依据：模型自行作答，无引用',
};

function stateBlock(payload) {
  const tags = [];
  if (payload.privacy_scope === 'private') tags.push({ text: '内部资料 · DeepSeek 整理', cls: '' });
  if (payload.privacy_scope === 'public') tags.push({ text: '公开资料通道', cls: '' });
  const known = STATUS[payload.status];
  if (known) tags.push({ text: known.label, cls: known.cls });
  if (payload.status === 'degraded' && payload.retryable) {
    tags.push({ text: '可稍后重试', cls: 'warn' });
  }
  // 需要补充信息时把「补什么」直接列出来：用户照着说一句就能继续，
  // 比让他自己猜该补什么（型号？故障码？）少一轮来回。
  const clar = payload.clarification;
  if (payload.status === 'needs_clarification' && clar && clar.hints) {
    clar.hints.forEach(function (hint) {
      tags.push({ text: '请补充：' + hint, cls: 'warn' });
    });
  }
  // 正常完成时标出依据来源：没有引用的回答值得让用户多看一眼
  if (payload.status === 'completed' && SOURCE[payload.answer_source]) {
    tags.push({ text: SOURCE[payload.answer_source], cls: '' });
  }
  if (!tags.length) return null;
  const box = document.createElement('div');
  box.className = 'state';
  tags.forEach(function (t) {
    const span = document.createElement('span');
    span.className = 'tag' + (t.cls ? ' ' + t.cls : '');
    span.textContent = t.text;
    box.appendChild(span);
  });
  return box;
}

function addBot(payload) {
  const el = document.createElement('div');
  el.className = 'msg bot';
  const body = document.createElement('div');
  body.className = 'bubble';
  body.innerHTML = fmt(payload.answer || '');
  const tags = stateBlock(payload);
  if (tags) body.insertBefore(tags, body.firstChild);
  // 版本并列提示放在引用之前：它决定「这份答案能不能直接用」，比出处更该先看到。
  if (payload.conflicts && payload.conflicts.length) {
    body.appendChild(conflictBlock(payload.conflicts));
  }
  if (payload.citations && payload.citations.length) body.appendChild(citesBlock(payload.citations));
  if (payload.pending_action) body.appendChild(pendingBlock(payload.pending_action));
  if (payload.message_id) body.appendChild(feedbackBlock(payload.message_id));
  el.innerHTML = '<div class="avatar">AI</div>';
  el.appendChild(body);
  wrap.appendChild(el);
  scroll();
  return el;
}

function citesBlock(citations) {
  const box = document.createElement('details');
  box.className = 'cites';
  const h = document.createElement('summary');
  h.className = 'h';
  h.textContent = '查看资料依据 · ' + citations.length + ' 条';
  box.appendChild(h);
  citations.forEach(function (c, i) {
    const d = document.createElement('div');
    d.className = 'cite';
    const page = (c.page === null || c.page === undefined) ? '' : ' · 第 ' + c.page + ' 页';
    // 每条依据都带上它适用的资料版本与机型场景，这是判断能不能直接用的前提条件。
    const meta = [];
    if (c.document_version) meta.push(c.document_version);
    if (c.scenario) meta.push(c.scenario);
    if (c.protocols && c.protocols.length) meta.push(c.protocols.join('/'));
    if (c.device_models && c.device_models.length) meta.push(c.device_models.join('/'));
    d.innerHTML =
      '<div class="t"><span class="n">[' + (i + 1) + ']</span>' +
      '<span class="f">' + esc(c.filename) + page + '</span>' +
      '<span class="s">相关度 ' + Number(c.score).toFixed(3) + '</span></div>' +
      (meta.length ? '<div class="m">' + esc(meta.join(' · ')) + '</div>' : '') +
      '<div class="e">' + esc(c.excerpt) + '</div>';
    d.onclick = function () { d.classList.toggle('open'); };
    box.appendChild(d);
  });
  return box;
}

      c.excerpts.map(function (text) {

      }).join('');
    box.appendChild(d);

  return box;

const MAX_PENDING_IMAGES = 6;
function renderImageDrafts() {
  const box = $('imageDrafts');
  box.hidden = !state.pendingImages.length;
  box.innerHTML = '';
  const note = document.createElement('div');
  note.className = 'hint';
  note.textContent = '已添加 ' + state.pendingImages.length + ' 张图片，点击发送后统一分析（最多6张）';
  box.appendChild(note);
  const cards = document.createElement('div'); cards.className = 'image-draft-cards';
  state.pendingImages.forEach((item, index) => {
    const card = document.createElement('div'); card.className = 'image-draft-card';
    const img = document.createElement('img'); img.src = item.url; img.alt = '待发送图片' + (index + 1);
    const remove = document.createElement('button'); remove.type = 'button'; remove.className = 'ghost';
    remove.textContent = '移除 ' + (index + 1); remove.disabled = state.busy;
    remove.onclick = () => {
      if (state.busy) return;
      URL.revokeObjectURL(item.url); state.pendingImages.splice(index, 1); renderImageDrafts();
    };
    card.append(img, remove); cards.appendChild(card);
  });
  box.appendChild(cards);
}
function clearImageDrafts() {
  state.pendingImages.forEach(item => URL.revokeObjectURL(item.url));
  state.pendingImages = []; renderImageDrafts();
}
function queueImages(files) {
  if (state.busy) { $('hint').textContent = '正在处理，请等待完成后再添加图片'; return; }
  let note = '';
  for (const file of files) {
    if (!['image/png', 'image/jpeg', 'image/webp'].includes(file.type)) {
      note = '请使用 PNG、JPG 或 WebP 图片'; continue;
    }
    if (state.pendingImages.length >= MAX_PENDING_IMAGES) { note = '一次最多添加6张图片'; break; }
    if (file.size > 10 * 1024 * 1024 || state.pendingImages.reduce((n,item)=>n+item.file.size,0)+file.size > 20*1024*1024) {
      note = '单张图片最多10MB，合计最多20MB'; continue;
    }
    state.pendingImages.push({file, url: URL.createObjectURL(file)});
  }
  renderImageDrafts();
  $('hint').textContent = note || '图片已暂存，可以继续添加图片或文字，点击发送后提交';
  input.focus();
}
async function send(text) {
  const explicitText = text !== undefined;
  const caption = (explicitText ? text : input.value).trim();
  const images = explicitText ? [] : [...state.pendingImages];
  if ((!caption && !images.length) || state.busy) return;
  state.busy = true; $('sendBtn').disabled = true; $('quizBtn').disabled = true;
  input.disabled = true; $('newBtn').disabled = true; renderImageDrafts();
  if (wrap.querySelector('.empty')) wrap.innerHTML = '';
  let preview;
  if (images.length) {
    preview = document.createElement('div'); preview.className = 'msg user';
    preview.innerHTML = '<div class="avatar">我</div><div class="bubble">' + images.length + ' 张图片' +
      (caption ? '<div>' + esc(caption) + '</div>' : '') + '<div class="image-draft-cards"></div></div>';
    images.forEach((item,index) => {
      const img=document.createElement('img'); img.className='quiz-thumb'; img.alt='图片'+(index+1);
      const url=URL.createObjectURL(item.file); img.src=url;
      img.onload=img.onerror=()=>URL.revokeObjectURL(url);
      preview.querySelector('.image-draft-cards').appendChild(img);
    });
    wrap.appendChild(preview);
  } else addUser(caption);
  addTyping();
  try {
    const body = new FormData();
    if (caption) body.append('message', caption);
    images.forEach(item => body.append('files', item.file));
    if (state.sessionId) body.append('session_id', state.sessionId);
    const result = await api('/input', { method: 'POST', body });
    clearTyping();
    if (!explicitText) { input.value = ''; clearImageDrafts(); autoGrow(); }
    if (result.kind === 'quiz') addQuizResult(result.quiz);
    else {
      rememberSession(result.chat.session_id);
      const answer = addBot(result.chat);
      if (images.length) addRecognitionEdit(answer, result.recognized_text);
      loadSessions();
    }
    $('hint').textContent = '已发送';
  } catch (e) {
    clearTyping();
    addBot({ status: 'failed', answer: '发送失败：' + e.message + '。图片和文字已保留，可修改后重试。' });
  } finally {
    state.busy = false; $('sendBtn').disabled = false; $('quizBtn').disabled = false;
    input.disabled = false; $('newBtn').disabled = false; renderImageDrafts(); input.focus();
  }
}

function autoGrow() {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 168) + 'px';
}

function lastSessionKey() { return 'smartpv:last-session:' + state.userId; }
function rememberSession(id) {
  state.sessionId = id;
  if (!state.userId) return;
  try { localStorage.setItem(lastSessionKey(), id || ''); } catch (error) {}
}
async function restoreLastConversation() {
  const owner = state.userId;
  const items = await loadSessions();
  if (owner !== state.userId) return;
  let saved = null;
  try { saved = localStorage.getItem(lastSessionKey()); } catch (error) {}
  // An explicit new conversation stays empty across a reload.
  if (saved === '') { showEmpty(); return; }
  if (saved && await openSession(saved, true)) return;
  if (owner !== state.userId) return;
  const latest = (items || []).find(item => item.user_id === owner);
  if (latest) await openSession(latest.id, true);
  else showEmpty();
}
async function loadSessions(offset = 0) {
  const owner = state.userId;
  try {
    const data = await api('/sessions?limit=20&offset=' + offset);
    if (owner !== state.userId) return null;
    const box = $('sessionList');
    if (!offset) box.innerHTML = '';
    const oldMore = $('historyMore'); if (oldMore) oldMore.remove();
    if (!data.items.length && !offset) {
      box.innerHTML = '<div class="hint" style="padding:4px 2px">暂无会话</div>';
      return [];
    }
    data.items.forEach(function (session) {
      const row = document.createElement('div');
      row.className = 'session' + (session.id === state.sessionId ? ' active' : '');
      row.title = session.title || session.id;
      row.innerHTML = esc(session.title || session.id.slice(0, 8)) + '<small>' + new Date(session.created_at).toLocaleString('zh-CN') + '</small>';
      row.onclick = function () { openSession(session.id); closeHistorySidebar(); };
      box.appendChild(row);
    });
    if (offset + data.items.length < data.total) {
      const more = document.createElement('button'); more.id = 'historyMore'; more.className = 'ghost';
      more.textContent = '加载更早的对话';
      more.onclick = async () => {
        more.disabled = true;
        await loadSessions(offset + data.items.length);
        more.disabled = false;
      };
      box.appendChild(more);
    }
    return data.items;
  } catch (error) {
    $('hint').textContent = '历史记录暂时加载失败，请刷新重试；数据库中的记录仍保留。';
    return null;
  }
}
async function openSession(id, quiet = false) {
  if (state.busy) return false;
  const owner = state.userId;
  try {
    const session = await api('/sessions/' + id);
    if (owner !== state.userId) return false;
    clearImageDrafts(); rememberSession(id);
    wrap.innerHTML = '';
    session.messages.forEach(function (message) {
      if (message.role === 'user') addUser(message.content, message.images || []);
      else addBot({ answer: message.content, citations: message.citations || [], message_id: message.id });
    });
    await loadSessions();
    return true;
  } catch (error) {
    if (!quiet) $('hint').textContent = '打开会话失败：' + error.message;
    return false;
  }
}

async function checkHealth() {
  try {
    const h = await api('/health');
    $('health').textContent = '服务正常 · v' + (h.version || '?') + ' · ' + h.environment;
    const badge = $('modeBadge');
    if (h.privacy_routing_enabled) {
      badge.textContent = '资料分库已开启 · DeepSeek ' + (h.llm_enabled ? '已配置' : '未配置');
      badge.title = '本次问题和命中的资料片段会发送给 DeepSeek，不附带聊天历史';
      badge.className = 'badge ' + (h.llm_enabled ? 'on' : 'off');
    } else if (h.llm_enabled) { badge.textContent = '大模型已接入'; badge.className = 'badge on'; }
    else { badge.textContent = '本地资料模式（远程模型已关闭）'; badge.className = 'badge off'; }
  } catch (e) {
    // 直接打开这个页面文件时没有后端，这里要说清楚，别让人以为程序坏了。
    $('health').textContent = '未连接本地服务';
    $('modeBadge').textContent = '离线预览';
    $('modeBadge').className = 'badge off';
    $('hint').textContent = '没有连上后端：请用启动脚本打开本页面';
  }
}

const chipBox = $('chips');
const workflowPanel = $('workflowPanel');
async function showPointTableForm() {
  workflowPanel.innerHTML =
    '<button class="close" type="button" aria-label="关闭点表制作">✕</button>' +
    '<strong>点表制作</strong><div>先选南向或北向，再上传这次设备的协议。</div>' +
    '<div class="pointtable-form"><div class="pointtable-fields">' +
    '<label for="ptDirection">方向<select id="ptDirection"><option value="south">南向</option>' +
    '<option value="north">北向</option></select></label>' +
    '<label for="ptFile">设备协议（Word/PDF）<input id="ptFile" type="file" ' +
    'accept=".doc,.docx,.pdf"></label></div>' +
    '<div class="pointtable-actions"><button class="ghost" id="ptParse" type="button">解析协议</button>' +
    '<span class="pointtable-note">仅在本机解析，不发送整份协议给 DeepSeek。</span></div>' +
    '<div class="err" id="ptError" role="alert"></div>' +
    '<div id="ptParsed" hidden><div id="ptSummary" class="pointtable-note"></div>' +
    '<div class="pointtable-fields" id="ptFields"></div>' +
    '<div id="ptWarnings" class="pointtable-note"></div>' +
    '<div class="pointtable-scroll"><table><thead id="ptHead"></thead><tbody id="ptRows"></tbody></table></div>' +
    '<div class="pointtable-actions"><button class="ghost" id="ptAddRow" type="button">添加点位</button>' +
    '<button class="ghost" id="ptValidate" type="button">检查点表</button>' +
    '<button class="primary" id="ptGenerate" type="button">生成并下载 CSV</button></div>' +
    '<div id="ptValidation" class="pointtable-note" role="status"></div></div></div>';
  workflowPanel.querySelector('.close').onclick = closeWorkflow;
  let parsed = null;
  const fieldNames = {
    name: '信号名称', address: '协议地址', north_address: '北向点号',
    function: '功能类型', register_type: '寄存器类型', access: '读写',
    data_type: '数据类型', count: '寄存器数', gain: '倍率', unit: '单位',
  };
  const options = {
    function: ['', '遥信', '双点遥信', '遥测', '遥控', '双点遥控', '遥调', '遥脉'],
    register_type: ['', '线圈', '输入离散量', '保持寄存器', '输入寄存器'],
    access: ['', 'RO', 'WO'],
    data_type: ['', 'BIT', 'UINT16', 'INT16', 'UINT32', 'INT32', 'FLOAT', 'DOUBLE'],
  };
  function pointColumns() {
    return parsed.direction === 'south'
      ? ['name', 'address', 'function', 'register_type', 'access', 'data_type', 'count', 'gain', 'unit']
      : ['name', 'north_address', 'function', 'unit'];
  }
  function readPoints() {
    return [...$('ptRows').querySelectorAll('tr')].map((row) => {
      const original = parsed.points[Number(row.dataset.index)] || {};
      const point = { ...original };
      row.querySelectorAll('[data-key]').forEach((control) => {
        point[control.dataset.key] = control.value.trim();
      });
      return point;
    });
  }
  function renderPoints() {
    const columns = pointColumns();
    $('ptHead').innerHTML = '<tr>' + columns.map((key) => '<th>' + fieldNames[key] + '</th>').join('') +
      '<th>操作</th></tr>';
    $('ptRows').innerHTML = '';
    parsed.points.forEach((point, index) => {
      const row = document.createElement('tr');
      row.dataset.index = index;
      columns.forEach((key) => {
        const cell = document.createElement('td');
        let control;
        if (options[key]) {
          control = document.createElement('select');
          options[key].forEach((value) => {
            const option = document.createElement('option');
            option.value = value; option.textContent = value || '请选择';
            control.appendChild(option);
          });
        } else {
          control = document.createElement('input');
          control.maxLength = 100;
        }
        control.dataset.key = key;
        control.value = point[key] || '';
        cell.appendChild(control);
        if (key === 'name' && point.source) {
          const source = document.createElement('small');
          source.className = 'pointtable-note';
          source.textContent = '协议：' + point.source;
          cell.appendChild(source);
        }
        row.appendChild(cell);
      });
      const action = document.createElement('td');
      const remove = document.createElement('button');
      remove.className = 'ghost'; remove.type = 'button'; remove.textContent = '移除';
      remove.onclick = function () {
        parsed.points = readPoints().filter((_, i) => i !== index);
        renderPoints();
      };
      action.appendChild(remove);
      row.appendChild(action);
      $('ptRows').appendChild(row);
    });
  }
  function renderParsed() {
    $('ptParsed').hidden = false;
    $('ptSummary').textContent = parsed.source_name + ' · 识别出 ' + parsed.points.length +
      ' 个候选点位，请核对后生成。';
    $('ptWarnings').textContent = parsed.warnings.join(' ');
    $('ptFields').innerHTML = '';
    parsed.common_fields.forEach((field) => {
      const label = document.createElement('label');
      label.textContent = field;
      const input = document.createElement('input');
      input.name = field;
      input.value = parsed.suggested_fields[field] || '';
      input.maxLength = 64;
      label.appendChild(input);
      $('ptFields').appendChild(label);
    });
    renderPoints();
  }
  function resetParsed() { parsed = null; $('ptParsed').hidden = true; $('ptError').textContent = ''; }
  $('ptDirection').onchange = resetParsed;
  $('ptFile').onchange = resetParsed;
  $('ptParse').onclick = async function () {
    const file = $('ptFile').files[0];
    if (!file) { $('ptError').textContent = '请先选择设备协议文件'; return; }
    const form = new FormData();
    form.append('direction', $('ptDirection').value);
    form.append('file', file);
    $('ptError').textContent = '';
    $('ptParse').disabled = true;
    try {
      parsed = await api('/point-tables/parse', { method: 'POST', body: form });
      renderParsed();
    } catch (error) { $('ptError').textContent = error.message; }
    finally { $('ptParse').disabled = false; }
  };
  $('ptAddRow').onclick = function () {
    parsed.points = readPoints();
    parsed.points.push({ name: '', address: '', north_address: '', function: '',
      register_type: '', access: '', data_type: '', count: '1', gain: '1', unit: '' });
    renderPoints();
  };
  function pointPayload() {
    const fields = {};
    $('ptFields').querySelectorAll('input').forEach((control) => {
      fields[control.name] = control.value.trim();
    });
    const points = readPoints();
    return { direction: parsed.direction, fields, points };
  }
  async function checkPoints(payload) {
    const result = await api('/point-tables/validate', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload),
    });
    $('ptValidation').textContent = (result.valid ? '未发现阻止生成的错误。' : '请先修改以下错误：') + '\n' +
      result.errors.map(item => '第' + item.row + '行：' + item.message).join('\n') + '\n' +
      result.warnings.map(item => (item.row ? '第' + item.row + '行：' : '') + item.message).join('\n');
    $('ptValidation').style.whiteSpace = 'pre-wrap';
    return result;
  }
  $('ptValidate').onclick = async function () {
    $('ptValidate').disabled = true;
    try { await checkPoints(pointPayload()); }
    catch (error) { $('ptError').textContent = error.message; }
    finally { $('ptValidate').disabled = false; }
  };
  $('ptGenerate').onclick = async function () {
    const payload = pointPayload();
    $('ptError').textContent = '';
    $('ptGenerate').disabled = true;
    try {
      const validation = await checkPoints(payload);
      if (!validation.valid) throw new Error('点表检查未通过，请按具体行号修改后重试');
      if (!window.confirm('请确认已经核对地址基数、字序、倍率和单位。CSV仅供人工确认后使用，是否继续下载？')) return;
      const res = await fetch('/point-tables/generate', {
        method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': state.csrfToken || '' },
        body: JSON.stringify(payload),
      });
      if (!res.ok) {
        const error = await res.json();
        if (res.status === 401) showLogin();
        throw new Error(error.detail || '生成失败');
      }
      const url = URL.createObjectURL(await res.blob());
      const link = document.createElement('a');
      link.href = url;
      link.download = '点表_' + (parsed.direction === 'south' ? '南向' : '北向') + '.csv';
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    } catch (error) { $('ptError').textContent = error.message; }
    finally { $('ptGenerate').disabled = false; }
  };
}
function closeWorkflow() {
  workflowPanel.hidden = true;
  chipBox.querySelectorAll('.chip').forEach((chip) => chip.classList.remove('active'));
  input.placeholder = defaultPlaceholder;
}
function openWorkflow(key) {
  const item = WORKFLOWS[key];
  workflowPanel.hidden = false;
  if (key === 'pointTable') showPointTableForm();
  else {
    workflowPanel.innerHTML =
      '<button class="close" type="button" aria-label="关闭提示">✕</button>' +
      '<strong>' + esc(item.title) + '</strong><div>' + esc(item.description) + '</div>';
    workflowPanel.querySelector('.close').onclick = closeWorkflow;
  }
  chipBox.querySelectorAll('.chip').forEach((chip) => {
    chip.classList.toggle('active', chip.dataset.workflow === key);
  });
  input.placeholder = item.placeholder;
  if (key !== 'pointTable') input.focus();
}
Object.entries(WORKFLOWS).forEach(function ([key, item]) {
  const b = document.createElement('button');
  b.className = 'chip';
  b.textContent = item.label;
  b.dataset.workflow = key;
  b.onclick = function () { openWorkflow(key); };
  chipBox.appendChild(b);
});


const ops = { tab: 'overview', offset: 0, busy: false };
const auditNames = {
  login: '登录', password_changed: '修改密码', user_created: '创建账号',
  user_disabled: '停用账号', user_enabled: '启用账号', document_imported: '导入资料',
  document_updated: '修改资料', backup_created: '创建备份', quiz_answered: '题目讲解',
  prompt_injection_blocked: '拦截异常请求', point_table_generated: '生成点表',
};
function opsPager(total) {
  const pager = document.createElement('div');
  pager.className = 'ops-pager';
  const prev = document.createElement('button'); prev.className = 'ghost'; prev.textContent = '上一页';
  prev.disabled = ops.offset === 0;
  prev.onclick = () => { ops.offset = Math.max(0, ops.offset - 25); loadOps(); };
  const next = document.createElement('button'); next.className = 'ghost'; next.textContent = '下一页';
  next.disabled = ops.offset + 25 >= total;
  next.onclick = () => { ops.offset += 25; loadOps(); };
  const text = document.createElement('span'); text.textContent = '共 ' + total + ' 条';
  pager.append(prev, text, next);
  return pager;
}
async function loadOps() {
  if (ops.busy) return;
  ops.busy = true;
  $('opsError').textContent = '';
  $('opsContent').textContent = '正在加载…';
  try {
    const url = '/admin/' + ops.tab +
      (['documents', 'audit'].includes(ops.tab) ? '?limit=25&offset=' + ops.offset : '');
    const data = await api(url);
    const box = $('opsContent'); box.innerHTML = '';
    if (ops.tab === 'overview') {
      const labels = { documents: '资料', chunks: '资料片段', users: '账号', conversations: '会话',
        messages: '消息', tickets: '历史工单', negative_feedback: '负面反馈' };
      const cards = document.createElement('div'); cards.className = 'ops-stats';
      Object.entries(labels).forEach(([key, label]) => {
        const card = document.createElement('div'); card.className = 'ops-stat';
        card.innerHTML = '<strong>' + esc(data.counts[key]) + '</strong>' + label;
        cards.appendChild(card);
      });
      box.appendChild(cards);
      const note = document.createElement('p');
      note.textContent = '版本 ' + data.version + ' · 身份验证' + (data.auth_enabled ? '已开启' : '未开启') +
        ' · 远程模型' + (data.model_enabled ? '已配置' : '未配置') +
        ' · 最近备份：' + (data.latest_backup[0]?.created_at || '暂无');
      box.appendChild(note);
    } else if (ops.tab === 'documents') {
      const upload = document.createElement('button'); upload.className = 'ghost'; upload.textContent = '导入资料';
      upload.onclick = () => $('fileInput').click(); box.appendChild(upload);
      const note = document.createElement('p'); note.textContent = '停用资料后，后续回答不再检索它；旧会话中的引用仍会保留。';
      box.appendChild(note);
      data.items.forEach((doc) => {
        const row = document.createElement('div'); row.className = 'ops-row';
        row.innerHTML = '<strong>' + esc(doc.filename) + '</strong><span class="hint">' + doc.chunks +
          ' 个片段 · ' + (doc.enabled ? '使用中' : '已停用') + '</span>';
        const fields = document.createElement('div'); fields.className = 'pointtable-fields';
        const versionLabel = document.createElement('label'); versionLabel.textContent = '资料版本';
        const version = document.createElement('input'); version.maxLength = 80;
        version.value = doc.document_version || ''; versionLabel.appendChild(version);
        const scopeLabel = document.createElement('label'); scopeLabel.textContent = '所属资料库';
        const scope = document.createElement('select');
        [['', '混合'], ['private', '隐私库'], ['public', '普通库']].forEach(([value, label]) => {
          const option = document.createElement('option'); option.value = value; option.textContent = label;
          scope.appendChild(option);
        });
        scope.value = doc.visibility === 'mixed' ? '' : doc.visibility; scopeLabel.appendChild(scope);
        fields.append(versionLabel, scopeLabel); row.appendChild(fields);
        const actions = document.createElement('div'); actions.className = 'pointtable-actions';
        const save = document.createElement('button'); save.className = 'ghost'; save.textContent = '保存设置';
        const toggle = document.createElement('button'); toggle.className = 'ghost';
        toggle.textContent = doc.enabled ? '停用资料' : '启用资料';
        async function update(body, btn) {
          btn.disabled = true;
          try {
            await api('/admin/documents/' + encodeURIComponent(doc.id), { method: 'PATCH',
              headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
            await loadOps();
          } catch (error) { $('opsError').textContent = error.message; }
          finally { btn.disabled = false; }
        }
        save.onclick = () => update({ document_version: version.value.trim(),
          ...(scope.value ? { visibility: scope.value } : {}) }, save);
        toggle.onclick = () => update({ enabled: !doc.enabled }, toggle);
        actions.append(save, toggle); row.appendChild(actions); box.appendChild(row);
      });
      box.appendChild(opsPager(data.total));
    } else if (ops.tab === 'audit') {
      data.items.forEach((item) => {
        const row = document.createElement('div'); row.className = 'ops-row';
        row.textContent = new Date(item.created_at).toLocaleString('zh-CN') + ' · ' + item.actor + ' · ' +
          (auditNames[item.action] || item.action);
        box.appendChild(row);
      });
      box.appendChild(opsPager(data.total));
    } else {
      const button = document.createElement('button'); button.className = 'primary'; button.textContent = '创建备份';
      button.onclick = async () => {
        button.disabled = true; button.textContent = '正在备份…';
        try { await api('/admin/backups', { method: 'POST' }); await loadOps(); }
        catch (error) { $('opsError').textContent = error.message; }
        finally { button.disabled = false; button.textContent = '创建备份'; }
      };
      box.appendChild(button);
      const note = document.createElement('p');
      note.textContent = '备份包含本地数据库和资料原件，不包含模型密钥。可下载留存；恢复时使用恢复工具，先恢复到新目录并核验，再停止服务切换。';
      box.appendChild(note);
      data.items.forEach((item) => {
        const row = document.createElement('div'); row.className = 'ops-row';
        const label = document.createElement('span');
        label.textContent = item.name + ' · ' + (item.bytes / 1024 / 1024).toFixed(1) + ' MB ';
        const link = document.createElement('a'); link.textContent = '下载备份';
        link.href = '/admin/backups/' + encodeURIComponent(item.name);
        row.append(label, link); box.appendChild(row);
      });
      if (!data.items.length) box.appendChild(document.createTextNode('暂无备份'));
    }
  } catch (error) { $('opsError').textContent = error.message; $('opsContent').textContent = ''; }
  finally { ops.busy = false; }
}
$('opsBtn').onclick = () => { $('opsScreen').hidden = false; ops.offset = 0; loadOps(); };
$('opsClose').onclick = () => { $('opsScreen').hidden = true; };
document.querySelectorAll('[data-ops]').forEach((button) => {
  button.onclick = () => { if (ops.busy) return; ops.tab = button.dataset.ops; ops.offset = 0; loadOps(); };
});

showEmpty();
checkHealth();
api('/auth/me').then(showApp).catch(showLogin);
</script>
